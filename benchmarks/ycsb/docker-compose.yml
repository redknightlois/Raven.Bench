# Self-contained compose file for the ycsb benchmark. It defines the three containerized
# targets; RavenDB is an external server and has no service here. Every mount is a Docker named
# volume, so the file stands alone on a clean clone.
#
# The harness records the image that actually served a run from the running container, so the
# moving tags below are safe: the recorded repo digest pins the image.
name: ravenbench-ycsb

services:
  postgresql:
    image: pgvector/pgvector:pg17
    container_name: ycsb-postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    volumes:
      - ycsb-postgresql-data:/var/lib/postgresql/data
    shm_size: 1g
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    container_name: ycsb-mongodb
    ports:
      - "27017:27017"
    volumes:
      - ycsb-mongodb-data:/data/db
    restart: unless-stopped

  documentdb:
    image: ghcr.io/microsoft/documentdb/documentdb-local:latest
    container_name: ycsb-documentdb
    ports:
      - "10260:10260"
    environment:
      USERNAME: bench
      PASSWORD: bench
    volumes:
      - ycsb-documentdb-data:/data
    restart: unless-stopped

volumes:
  ycsb-postgresql-data:
  ycsb-mongodb-data:
  ycsb-documentdb-data:
