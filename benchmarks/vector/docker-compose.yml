# No service sets a performance option of its own; the result records the settings in force as the
# server reports them. The pgvector service publishes 5432 like the ycsb postgresql service, so only
# one of them runs at a time.
name: ravenbench-vector

services:
  pgvector:
    image: pgvector/pgvector:0.8.1-pg17
    # Capacity, not tuning: the pool holds one connection per reader, and the scenario runs 1000 readers.
    command: ["postgres", "-c", "max_connections=1100"]
    ports:
      - "${PGVECTOR_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    volumes:
      - vector-pgvector-data:/var/lib/postgresql/data
    restart: unless-stopped

  ravendb-7:
    image: ravendb/ravendb:7.2.6
    ports:
      - "${RAVENDB7_PORT:-8087}:${RAVENDB7_PORT:-8087}"
      - "${RAVENDB7_TCP_PORT:-38887}:${RAVENDB7_TCP_PORT:-38887}"
    environment:
      RAVEN_Setup_Mode: None
      RAVEN_License_Eula_Accepted: "true"
      RAVEN_Security_UnsecuredAccessAllowed: PublicNetwork
      RAVEN_ServerUrl: "http://0.0.0.0:${RAVENDB7_PORT:-8087}"
      RAVEN_PublicServerUrl: "http://${RAVENDB_HOST:-localhost}:${RAVENDB7_PORT:-8087}"
      RAVEN_ServerUrl_Tcp: "tcp://0.0.0.0:${RAVENDB7_TCP_PORT:-38887}"
      RAVEN_PublicServerUrl_Tcp: "tcp://${RAVENDB_HOST:-localhost}:${RAVENDB7_TCP_PORT:-38887}"
    volumes:
      - vector-ravendb7-data:/var/lib/ravendb/data
    restart: unless-stopped

  # Security is off as for the other two services. The self-generated trial licence enables bbq_disk;
  # a cluster gets one 30-day trial, so run.sh starts a fresh cluster per run. The heap is the image default.
  elasticsearch:
    image: elasticsearch:9.5.3
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.license.self_generated.type: "${ELASTICSEARCH_LICENSE:-trial}"
      ES_JAVA_OPTS: "${ELASTICSEARCH_JAVA_OPTS:-}"
    volumes:
      # A host path in ELASTICSEARCH_DATA_DIR bind-mounts the data directory; unset, a named volume holds it.
      - "${ELASTICSEARCH_DATA_DIR:-vector-elasticsearch-data}:/usr/share/elasticsearch/data"

volumes:
  vector-elasticsearch-data:
  vector-pgvector-data:
  vector-ravendb7-data:
